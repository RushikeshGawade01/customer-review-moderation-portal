app_name: "customer-review-moderation-portal"
app_version: "1.0.0"
app_user: "crmpuser"
app_group: "crmpgroup"
app_uid: 1000
app_gid: 1000

# Base Directory Layout
app_base_dir: "/opt/review-app"
app_config_dir: "/opt/review-app/config"
app_log_dir: "/opt/review-app/logs"
app_data_dir: "/opt/review-app/data"

# Port & Networking
app_port: 8080
firewall_allowed_ports:
  - "8080/tcp"
  - "22/tcp"

# System Packages Prerequisites
prerequisite_packages:
  - "curl"
  - "wget"
  - "git"
  - "tar"
  - "unzip"
  - "ufw"
  - "ca-certificates"

# Java & Container Runtime
java_package: "openjdk-21-jre-headless"
docker_package: "docker.io"
docker_image_name: "crmp"
docker_image_tag: "1.0.0"
docker_container_name: "crmp-app"
docker_registry: "docker.io/rushikeshgawade/crmp"

# Health Probe Settings
health_check_endpoint: "http://localhost:8080/actuator/health"
health_check_retries: 5
health_check_delay: 3
