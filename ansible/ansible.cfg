[defaults]
inventory               = ./hosts.ini
roles_path              = ./roles
host_key_checking       = False
retry_files_enabled     = False
stdout_callback         = default
deprecation_warnings    = False
command_warnings        = False
nocows                  = 1
remote_user             = crmpuser
timeout                 = 30

[privilege_escalation]
become                  = True
become_method           = sudo
become_user             = root
become_ask_pass         = False
