[crmp_nodes]
crmp-prod-node01 ansible_host=127.0.0.1 ansible_connection=local app_env=production server_port=8080 max_heap=512m

[staging]
crmp-stage-node01 ansible_host=127.0.0.1 ansible_connection=local app_env=staging server_port=8081 max_heap=256m

[local]
localhost ansible_connection=local

[crmp_all:children]
crmp_nodes
staging
local

[crmp_all:vars]
ansible_python_interpreter=python
ansible_user=crmpuser
deploy_base_dir=/opt/review-app
ansible_become=true
