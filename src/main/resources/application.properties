# Server Port
server.port=8080

# Application Name
spring.application.name=customer-review-moderation-portal

# In-Memory H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:crmpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Boot Actuator Telemetry
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Thymeleaf Template Cache (disable for development reloading)
spring.thymeleaf.cache=false
